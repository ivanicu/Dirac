name: Build

on:
  push:
    branches: main   # was `master`: inherited from upstream Mol*, and this fork's canonical branch is main — so these two workflows had never run here
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm ci
    - run: sudo apt-get install xvfb
    - name: Lint debt ratchet + clean product shell
      run: node scripts/check_lint_ratchet.mjs
    - name: Test
      run: npm install --no-save "gl@^6.0.2" && xvfb-run --auto-servernum npm run jest
    - name: Build
      run: npm run build
