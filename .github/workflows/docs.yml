name: Build vendored Mol* docs

on:
  push:
    branches: main
    paths:
      - docs/docs/**
      - docs/mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    branches: main
    paths:
      - docs/docs/**
      - docs/mkdocs.yml
      - .github/workflows/docs.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Build inherited Mol* manual
        run: cd docs && mkdocs build

# This workflow deliberately does not deploy to molstar/docs. Dirac is a fork and must
# not publish into the upstream project's documentation repository.
