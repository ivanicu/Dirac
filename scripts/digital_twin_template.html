<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dirac · Architecture Optimization Twin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23071311'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='42' fill='%235de4cf'%3Eδ%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg:#07110f; --panel:#0b1715; --panel2:#10201d; --ink:#e8f5f1; --muted:#849b95;
  --line:#213a35; --mint:#64e1c5; --blue:#75baff; --gold:#f3bd64; --red:#ff7d78;
  --green:#8ee39c; --purple:#b39aff; --shadow:0 18px 60px #0007;
}
* { box-sizing:border-box }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif }
body:before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 75% 0,#19413755,transparent 38%),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px); background-size:auto,40px 40px,40px 40px }
button,input,select { font:inherit }
button { color:inherit }
.app { height:100%; display:grid; grid-template-rows:76px 1fr }
.top { z-index:5; display:flex; align-items:center; gap:18px; padding:0 22px; border-bottom:1px solid var(--line); background:#081310ed; backdrop-filter:blur(14px) }
.brand { min-width:310px; display:flex; align-items:center; gap:13px }
.mark { width:38px; height:38px; border:1px solid var(--mint); display:grid; place-items:center; transform:rotate(45deg); box-shadow:0 0 25px #64e1c533 }
.mark span { transform:rotate(-45deg); color:var(--mint); font-weight:800 }
.eyebrow { color:var(--mint); font:700 10px/1.5 ui-monospace,monospace; text-transform:uppercase; letter-spacing:.15em }
h1 { margin:0; font-size:16px; letter-spacing:.02em }
.truth-strip { margin-left:auto; display:flex; align-items:center; gap:9px }
.truth-chip { padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:#0c1917; font:11px ui-monospace,monospace; color:#abc0bb }
.truth-chip b { color:var(--ink) }
.truth-chip.good { border-color:#376d5e; color:var(--green) }
.truth-chip.warn { border-color:#735d34; color:var(--gold) }
.body { min-height:0; display:grid; grid-template-columns:268px minmax(540px,1fr) 350px }
.nav,.guide { min-height:0; overflow:auto; background:#091411ed; z-index:2 }
.nav { padding:20px 16px; border-right:1px solid var(--line) }
.guide { padding:22px; border-left:1px solid var(--line) }
.nav-label { margin:0 7px 9px; color:#6f8882; font:700 9px ui-monospace,monospace; letter-spacing:.18em; text-transform:uppercase }
.nav-list { display:grid; gap:6px; margin-bottom:24px }
.nav-btn { width:100%; border:1px solid transparent; border-radius:7px; padding:10px 11px; display:grid; grid-template-columns:25px 1fr; gap:8px; text-align:left; background:transparent; cursor:pointer }
.nav-btn:hover { background:#10201d }
.nav-btn.active { border-color:#397566; background:#10241f }
.nav-btn i { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:#162925; color:var(--mint); font:700 10px ui-monospace,monospace; font-style:normal }
.nav-btn b { font-size:12px; font-weight:620 }
.nav-btn small { display:block; margin-top:3px; color:var(--muted); font-size:10px; line-height:1.4 }
.model-boundary { margin:25px 7px 0; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.55 }
.model-boundary b { color:var(--ink) }
.main { min-height:0; overflow:auto; position:relative; padding:30px 34px 60px }
.page-head { max-width:980px; margin:0 auto 24px }
.page-head h2 { margin:7px 0 8px; font-size:27px; letter-spacing:-.025em }
.page-head p { max-width:800px; margin:0; color:#a6bbb6; font-size:13px; line-height:1.65 }
.grid { max-width:980px; margin:0 auto; display:grid; gap:12px }
.grid.two { grid-template-columns:repeat(2,minmax(0,1fr)) }
.grid.three { grid-template-columns:repeat(3,minmax(0,1fr)) }
.card { position:relative; padding:17px; border:1px solid var(--line); border-radius:9px; background:linear-gradient(145deg,#0f1e1b,#0a1513); box-shadow:0 8px 30px #0002 }
.card h3 { margin:4px 0 7px; font-size:15px }
.card p { margin:0; color:#94aaa4; font-size:11px; line-height:1.6 }
.card .number { margin:7px 0 2px; font:700 30px ui-monospace,monospace }
.card.good { border-color:#315e52 }.card.warn { border-color:#6b5632 }.card.bad { border-color:#6a3838 }
.status { display:inline-flex; align-items:center; gap:6px; font:700 9px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.1em }
.status:before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor }
.status.pass { color:var(--green) }.status.warn { color:var(--gold) }.status.fail { color:var(--red) }
.section-title { max-width:980px; margin:28px auto 12px; display:flex; align-items:end; justify-content:space-between; gap:16px }
.section-title h3 { margin:0; font-size:15px }.section-title span { color:var(--muted); font-size:10px }
.flow { max-width:980px; margin:0 auto; display:flex; align-items:stretch; gap:7px; overflow-x:auto; padding:2px 2px 14px }
.flow-card { min-width:132px; flex:1; padding:13px; border:1px solid var(--line); background:#0e1e1b; border-radius:7px; cursor:pointer }
.flow-card:hover { border-color:var(--mint) }.flow-card b { display:block; font-size:11px; line-height:1.35 }.flow-card small { display:block; color:var(--muted); margin-top:6px; font-size:9px; line-height:1.45 }
.flow-arrow { align-self:center; color:#47766b; font:18px ui-monospace,monospace }
.lane { max-width:980px; margin:0 auto 10px; display:grid; grid-template-columns:120px 1fr; gap:12px; align-items:start }
.lane-label { padding:13px 0; color:var(--muted); font:700 10px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.12em }
.lane-body { display:flex; flex-wrap:wrap; gap:7px; padding:8px; border-left:2px solid #26433d }
.node-chip { border:1px solid var(--line); border-radius:5px; padding:8px 10px; background:#0e1d1a; font-size:10px; cursor:pointer }.node-chip:hover { border-color:var(--mint) }
.workspace-grid { max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px }
.workspace { padding:14px; border:1px solid var(--line); border-radius:8px; background:#0c1917 }.workspace.implemented { border-color:#34705f }.workspace.gated { opacity:.66 }
.workspace h4 { margin:5px 0 7px; font-size:13px }.workspace ul { list-style:none; padding:0; margin:0 }.workspace li { padding:3px 0; color:#829a94; font-size:9px }.workspace li.live { color:var(--green) }
.finding { max-width:980px; margin:0 auto 10px; display:grid; grid-template-columns:55px minmax(190px,.7fr) 1fr 1fr; gap:14px; align-items:start; padding:16px; border:1px solid var(--line); border-radius:8px; background:#0c1917 }
.priority { display:inline-grid; place-items:center; min-height:30px; border:1px solid #735d34; border-radius:5px; color:var(--gold); font:800 11px ui-monospace,monospace }.finding h4 { margin:0 0 6px; font-size:12px }.finding p { margin:0; color:var(--muted); font-size:10px; line-height:1.55 }.finding strong { display:block; margin-bottom:4px; color:#b8cbc6; font:700 9px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.09em }
.check { max-width:980px; margin:0 auto 8px; display:grid; grid-template-columns:20px minmax(180px,.65fr) 110px 1fr; gap:12px; align-items:center; padding:13px 15px; border:1px solid var(--line); border-radius:7px; background:#0c1917 }.check-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 12px currentColor }.check.warn .check-dot { background:var(--gold) }.check.fail .check-dot { background:var(--red) }.check b { font-size:11px }.check code { color:var(--mint); font:11px ui-monospace,monospace }.check span { color:var(--muted); font-size:10px; line-height:1.45 }
.table { max-width:980px; margin:0 auto; border:1px solid var(--line); border-radius:8px; overflow:hidden }.row { display:grid; grid-template-columns:50px minmax(210px,1.2fr) 1fr 65px 65px; gap:12px; align-items:center; min-height:42px; padding:8px 12px; border-bottom:1px solid #182b27; background:#0b1815; cursor:pointer }.row:last-child { border-bottom:0 }.row:hover { background:#10231f }.row.header { color:var(--muted); font:700 9px ui-monospace,monospace; text-transform:uppercase; cursor:default }.row b { font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }.row small { color:var(--muted); font:9px ui-monospace,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }.score { color:var(--gold); font:700 11px ui-monospace,monospace }
.toolbox { max-width:980px; margin:0 auto 14px; display:flex; gap:8px }.input,.select { min-width:0; border:1px solid var(--line); border-radius:7px; background:#081310; color:var(--ink); padding:11px 12px; outline:none }.input { flex:1 }.input:focus,.select:focus { border-color:var(--mint) }
.impact { max-width:980px; margin:0 auto; display:grid; grid-template-columns:1fr 180px 1fr; gap:12px }.impact-col { min-height:350px; border:1px solid var(--line); border-radius:8px; padding:14px; background:#0b1815 }.impact-col h4 { margin:0 0 11px; color:var(--muted); font:700 9px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.12em }.impact-seed { display:grid; place-items:center; text-align:center; border:1px solid #3d7c6b; background:#102820 }.impact-seed b { font-size:13px; overflow-wrap:anywhere }.impact-seed small { margin-top:8px; color:var(--muted); font:9px ui-monospace,monospace }.impact-item { padding:8px; margin-bottom:6px; border-left:2px solid #31564d; background:#10201d; cursor:pointer }.impact-item b { display:block; font-size:10px; overflow-wrap:anywhere }.impact-item small { color:var(--muted); font:9px ui-monospace,monospace }
.search-results { max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px }.result { padding:11px; border:1px solid var(--line); border-radius:7px; background:#0b1916; cursor:pointer }.result:hover { border-color:var(--mint) }.result b { display:block; font-size:11px; overflow-wrap:anywhere }.result small { display:block; margin-top:4px; color:var(--muted); font:9px ui-monospace,monospace; overflow-wrap:anywhere }
.guide h2 { margin:7px 0 10px; font-size:20px; line-height:1.25 }.guide-copy { color:#a5bab5; font-size:12px; line-height:1.7 }.guide-block { margin-top:22px; padding-top:17px; border-top:1px solid var(--line) }.guide-block h3 { margin:0 0 8px; color:var(--muted); font:700 9px ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase }.guide-block p { margin:0; color:#a5bab5; font-size:11px; line-height:1.65 }.guide-callout { margin-top:18px; padding:13px; border-left:2px solid var(--gold); background:#151b14; color:#c8c2a8; font-size:11px; line-height:1.6 }
.source { margin:12px 0; padding:10px; border:1px solid var(--line); border-radius:6px; background:#06100e; color:#9fc2ba; font:10px/1.5 ui-monospace,monospace; overflow-wrap:anywhere }.kv { display:grid; grid-template-columns:90px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid #172a26; font-size:10px }.kv span:first-child { color:var(--muted) }.relation { margin:5px 0; padding:7px 8px; background:#0f201c; border-left:2px solid #2d5148; font-size:9px; cursor:pointer }.relation:hover { border-color:var(--mint) }
.empty { max-width:980px; margin:0 auto; padding:35px; border:1px dashed var(--line); color:var(--muted); text-align:center; font-size:12px }
@media(max-width:1120px){.body{grid-template-columns:230px 1fr}.guide{position:fixed;right:0;top:76px;bottom:0;width:330px;box-shadow:var(--shadow)}.main{padding-right:355px}.truth-chip:nth-child(n+3){display:none}.workspace-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.body{grid-template-columns:1fr}.nav,.guide{display:none}.main{padding:22px}.brand{min-width:0}.truth-strip{display:none}.grid.three,.grid.two,.workspace-grid,.search-results{grid-template-columns:1fr}.finding{grid-template-columns:45px 1fr}.finding>div:nth-child(n+3){grid-column:2}.impact{grid-template-columns:1fr}.row{grid-template-columns:45px 1fr}.row>*:nth-child(n+3){display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark"><span>δ</span></div><div><div class="eyebrow">Architecture optimization instrument</div><h1>Dirac · Observed Twin</h1></div></div>
    <div class="truth-strip" id="truth-strip"></div>
  </header>
  <div class="body">
    <aside class="nav">
      <div class="nav-label">导览 · 先理解，再下钻</div><div class="nav-list" id="tour-nav"></div>
      <div class="nav-label">优化工具</div><div class="nav-list" id="tool-nav"></div>
      <div class="model-boundary" id="model-boundary"></div>
    </aside>
    <main class="main" id="main"></main>
    <aside class="guide" id="guide"></aside>
  </div>
</div>
<script id="twin-data" type="application/json">__DIRAC_TWIN_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('twin-data').textContent);
const A=D.analysis, P=A.product_reality, R=D.runtime_snapshot;
const byId=new Map(D.nodes.map(n=>[n.id,n])), incoming=new Map(), outgoing=new Map();
for(const e of D.edges){if(!outgoing.has(e.source))outgoing.set(e.source,[]);outgoing.get(e.source).push(e);if(!incoming.has(e.target))incoming.set(e.target,[]);incoming.get(e.target).push(e)}
const tours=[
 {id:'truth',n:'01',label:'到底做完了什么？',sub:'平台完成 ≠ 产品完成'},
 {id:'backbone',n:'02',label:'系统主干是什么？',sub:'所有入口汇入一套语义'},
 {id:'durable',n:'03',label:'计算如何变成证据？',sub:'Job、cache、artifact、provenance'},
 {id:'context',n:'04',label:'前端为何不会失忆？',sub:'一个时钟、一个 scene'},
 {id:'product',n:'05',label:'产品真实到哪里？',sub:'3/8 Workspace，7/30 View'},
 {id:'optimize',n:'06',label:'下一步优化什么？',sub:'从证据到优先级'}
];
const tools=[
 {id:'health',n:'H',label:'架构健康',sub:'不变量、漂移和热点'},
 {id:'impact',n:'Δ',label:'变更影响模拟',sub:'选择节点，查看传播半径'},
 {id:'explorer',n:'ƒ',label:'函数与对象索引',sub:'完整细节在这里，不堵入口'}
];
let state={page:'truth',impactSeed:'system:dispatcher',depth:2,query:'',type:'all'};
const main=document.getElementById('main'), guide=document.getElementById('guide');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodeName=id=>byId.get(id)?.qualified_name||byId.get(id)?.name||id;
document.getElementById('truth-strip').innerHTML=`<span class="truth-chip good"><b>SUBSTRATE</b> COMPLETE</span><span class="truth-chip warn"><b>PRODUCT</b> PARTIAL</span><span class="truth-chip ${R.twin_watcher_active?'good':''}"><b>SOURCE</b> ${R.twin_watcher_active?'AUTO-SYNC':'SNAPSHOT'}</span><span class="truth-chip good"><b>${A.maturity.level}</b> OBSERVED</span><span class="truth-chip">${D.summary.nodes.toLocaleString()} nodes · ${(D.summary.by_type.function+D.summary.by_type.method).toLocaleString()} functions</span>`;
document.getElementById('model-boundary').innerHTML=`<b>同步边界</b><br>first-party 源码由 watcher 递归自动同步；command traces 持久写入数据库，孪生节点在每次重建时刷新观测聚合。<br><br><b>观测</b><br>${R.operational_metrics.command_traces||0} traces · ${R.operational_metrics.observed_commands||0}/17 commands<br>${new Date(R.captured_at).toLocaleString()}<br><br><b>外部边界</b><br>Mol*、RDKit、PySCF、xTB 内部不冒充 Dirac 自有代码。`;
function nav(){document.getElementById('tour-nav').innerHTML=tours.map(x=>navButton(x)).join('');document.getElementById('tool-nav').innerHTML=tools.map(x=>navButton(x)).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()})}
function navButton(x){return `<button class="nav-btn ${state.page===x.id?'active':''}" data-page="${x.id}"><i>${x.n}</i><span><b>${x.label}</b><small>${x.sub}</small></span></button>`}
function head(kicker,title,copy){return `<header class="page-head"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${copy}</p></header>`}
function setGuide(kicker,title,copy,look,decision){guide.innerHTML=`<div class="eyebrow">${kicker}</div><h2>${title}</h2><div class="guide-copy">${copy}</div><div class="guide-block"><h3>你应该看什么</h3><p>${look}</p></div><div class="guide-block"><h3>这个视图支持什么决策</h3><p>${decision}</p></div>`}
function statusCard(kind,title,number,copy){return `<article class="card ${kind}"><span class="status ${kind==='good'?'pass':'warn'}">${kind==='good'?'confirmed':'boundary'}</span><div class="number">${number}</div><h3>${title}</h3><p>${copy}</p></article>`}
function render(){nav();({truth:renderTruth,backbone:renderBackbone,durable:()=>renderFlow('durable-compute'),context:()=>renderFlow('scientific-context'),product:renderProduct,optimize:renderOptimize,health:renderHealth,impact:renderImpact,explorer:renderExplorer}[state.page]||renderTruth)()}
function renderTruth(){const sync=D.flows.find(x=>x.id==='source-sync');main.innerHTML=head('01 · scope truth','先钉死“完成”的对象','完成的是新架构的 platform substrate，不是整个药物发现产品。孪生已经从结构镜像升级为带真实 command outcome 与 latency 的观测模型。')+`<section class="grid three">${statusCard('good','平台 substrate','COMPLETE','统一语义命令、方法、Job、Artifact、SDK/CLI/MCP、AppShell、ScientificContext 与持久场景满足阶段 DoD。')}${statusCard('warn','产品实现','PARTIAL',`${P.workspaces_implemented}/${P.workspaces_total} Workspaces、${P.views_implemented}/${P.views_total} Views 已实现；其余是信息架构，不是交付。`)}${statusCard('good','孪生成熟度',A.maturity.level,`${R.operational_metrics.command_traces||0} 条持久 trace 已按 command / method 节点校准结果与延迟；尚不预测未见输入。`)}</section><div class="section-title"><h3>什么才算“真的孪生”</h3><span>成熟度阶梯</span></div><section class="grid three"><article class="card good"><div class="eyebrow">L1 · 已有</div><h3>结构自动同步</h3><p>${D.scope.discovered_files} 个 first-party 文件由 watcher 递归发现；新增文件、函数和引用无需登记。</p></article><article class="card good"><div class="eyebrow">L2 · 已有</div><h3>诊断与影响</h3><p>合并运行快照、架构不变量、风险排序和依赖半径模拟。</p></article><article class="card good"><div class="eyebrow">L3 · 当前</div><h3>真实观测校准</h3><p>持久 command trace、Job 终态、cache 与延迟聚合直接绑定现有节点；真实覆盖自然累积，不制造流量。</p></article></section><div class="section-title"><h3>自动同步链</h3><span>event-driven · 900 ms debounce · atomic output</span></div>${flowCards(sync.steps.map(s=>s.node),Object.fromEntries(sync.steps.map(s=>[s.node,s.label])))}`;wireNodeClicks();setGuide('导游判断','完成必须有明确宾语','“平台 substrate 完成”与“L3 观测孪生”都有可验证证据；“整个 Dirac 产品完成”仍然不成立。',`三张卡分别回答交付范围、产品范围与模型范围。节点检查器现在会显示 runtime_observation。`,`据此选择下一条产品垂直切片；架构层的下一成熟度是经验证的预测模型与受治理的自动优化，不应提前冒充。`)}
const backbone=['actor:human','surface:gui','transport:http-v2','system:dispatcher','system:kernel','system:invocation','system:executor','store:jobs','store:artifacts','store:postgres'];
function flowCards(ids,labels={}){return `<div class="flow">${ids.map((id,i)=>`${i?'<span class="flow-arrow">→</span>':''}<button class="flow-card" data-node="${esc(id)}"><b>${esc(nodeName(id))}</b><small>${esc(labels[id]||byId.get(id)?.type)}</small></button>`).join('')}</div>`}
function wireNodeClicks(){document.querySelectorAll('[data-node]').forEach(x=>x.onclick=()=>inspectNode(x.dataset.node))}
function renderBackbone(){main.innerHTML=head('02 · semantic spine','所有入口最终只允许有一种科学语义','GUI、CLI、SDK 与 MCP 是不同交互表面，不是四套产品内核。主干的目的，是让验证、方法版本、Job、缓存、错误和 provenance 不随入口改变。')+flowCards(backbone,{'actor:human':'表达科学意图','surface:gui':'人类交互投影','transport:http-v2':'统一 Envelope','system:dispatcher':'契约与 actor 门','system:kernel':'能力组合根','system:invocation':'方法执行语义','system:executor':'可替换执行边界','store:jobs':'持久生命周期','store:artifacts':'内容寻址结果','store:postgres':'事实权威'})+`<div class="section-title"><h3>入口汇聚</h3><span>adapter 不拥有科学逻辑</span></div><div class="lane"><div class="lane-label">Human</div><div class="lane-body"><button class="node-chip" data-node="surface:gui">GUI</button><button class="node-chip" data-node="surface:cli">CLI</button></div></div><div class="lane"><div class="lane-label">Programmatic</div><div class="lane-body"><button class="node-chip" data-node="surface:python-sdk">Python SDK</button><button class="node-chip" data-node="surface:typescript-sdk">TypeScript SDK</button><button class="node-chip" data-node="surface:mcp">MCP</button></div></div><div class="lane"><div class="lane-label">One boundary</div><div class="lane-body"><button class="node-chip" data-node="transport:http-v2">HTTP v2</button><button class="node-chip" data-node="registry:commands">Command Registry · 17</button><button class="node-chip" data-node="registry:methods">Method Registry · 12</button></div></div>`;wireNodeClicks();setGuide('系统主干','先看 10 个节点，不看 3,000 个','这是最重要的一条架构叙事：意图进入统一命令边界，科学执行进入统一 invocation 边界，结果进入持久证据链。',`如果某个新功能绕过 Dispatcher、Invocation、Job 或 Artifact，它就在制造第二套语义。`,`评审新能力时，先判断它应当新增 Method、Command、Module 还是 View，而不是先加 route 或页面。`)}
function renderFlow(id){const f=D.flows.find(x=>x.id===id);main.innerHTML=head(id==='scientific-context'?'04 · continuity':'03 · durable evidence',f.name,f.summary)+flowCards(f.steps.map(s=>s.node),Object.fromEntries(f.steps.map(s=>[s.node,s.label])))+`<div class="section-title"><h3>${id==='scientific-context'?'需要守住的两个单例':'Job 不是进度条，而是证据记录'}</h3></div><section class="grid two">${id==='scientific-context'?`<article class="card good"><div class="eyebrow">one clock</div><h3>ScientificContext</h3><p>异步结果只能提交给产生它的 generation，防止 molecule A 的结果出现在 molecule B。</p></article><article class="card good"><div class="eyebrow">one scene</div><h3>SceneService</h3><p>mol* 实例位于 View 之上；导航改变投影，不重建科学场景。</p></article>`:`<article class="card good"><div class="eyebrow">identity</div><h3>方法版本控制 currency</h3><p>输入身份与 method version 一起决定 cache 是否仍可服务。</p></article><article class="card good"><div class="eyebrow">evidence</div><h3>Artifact 内容寻址</h3><p>结果字节有稳定 SHA-256，Job 只引用证据，不把大对象塞进 JSON。</p></article>`}</section>`;wireNodeClicks();setGuide('信息流',f.name,id==='scientific-context'?'这个流解释为什么切换 Workspace 不应让上下文、选择和相机互相矛盾。':'这个流解释一次长计算如何从请求变成可追踪、可复用、可审计的结果。',`逐步看“谁拥有状态”。状态所有权如果落在 adapter 或 View 中，就是未来漂移点。`,id==='scientific-context'?'新增前端能力时检查是否引入第二个 generation 或第二个 mol* owner。':'优化执行层时可以替换 Executor，但不能改变上层命令、Job 和 Artifact 语义。')}
function renderProduct(){const grouped=new Map();for(const w of P.workspaces)grouped.set(w.id,[]);for(const v of P.views)grouped.get(v.workspace)?.push(v);main.innerHTML=head('05 · product reality','注册表是路线图，不是完成证明',`8×30 信息架构已经稳定，但只有 ${P.workspaces_implemented} 个 Workspace 和 ${P.views_implemented} 个 View 暴露真实能力。gated 是诚实状态，不是缺陷伪装。`)+`<section class="workspace-grid">${P.workspaces.map(w=>{const views=grouped.get(w.id)||[],live=views.filter(v=>v.implemented).length;return `<article class="workspace ${w.availability}"><span class="status ${w.availability==='implemented'?'pass':'warn'}">${w.availability}</span><h4>${esc(w.label)}</h4><ul>${views.map(v=>`<li class="${v.implemented?'live':''}">${v.implemented?'●':'○'} ${esc(v.label)}</li>`).join('')}</ul><p>${live}/${views.length} Views live</p></article>`}).join('')}</section>`;setGuide('产品边界','为什么不能把 30 个 View 都做成空页面','Workspace 代表长期的人类工作语境。一个 View 只有在能够回答真实科学问题时才应该出现。',`绿色是当前垂直切片，灰黄色是经过设计但尚未交付的能力。`,`下一条产品垂直切片应该选择一个高价值科学问题，从 Method→Command→Object→Module→View 贯通，而不是横向填页面。`)}
function renderOptimize(){main.innerHTML=head('06 · optimization ledger','DT 的价值不是“看见所有节点”，而是缩短架构决策','每条记录保留证据、影响和动作；DONE 表示改动已落地并进入门禁，不表示产品范围被偷偷扩大。')+A.findings.map(f=>`<article class="finding"><span class="priority">${esc(f.priority)}</span><div><h4>${esc(f.title)}</h4><p>${esc(f.kind)}</p></div><div><strong>Evidence → impact</strong><p>${esc(f.evidence)} ${esc(f.impact)}</p></div><div><strong>Action / guardrail</strong><p>${esc(f.action)}</p></div></article>`).join('');setGuide('优化导向','三个架构问题已经闭环','Attention 分类、node-keyed traces 和 fitness ratchets 都有数据库或自测证据，并会随源码与运行观测继续更新。',`DONE 项仍显示，是为了保留“发现→修改→验证→防回退”的因果链；SCOPE 是刻意不做的边界。`,`下一步产品工作应走真实 Method→Command→Object→Module→View 垂直切片；DT 用观测数据判断风险和影响，不替产品路线图做价值选择。`)}
function renderHealth(){main.innerHTML=head('architecture health','守住不变量，再处理热点','健康视图把确定性门禁与启发式风险分开。PASS 是契约事实；热点分数只是重构优先级，绝不是故障概率。')+A.health_checks.map(c=>`<div class="check ${c.status}"><i class="check-dot"></i><b>${esc(c.label)}</b><code>${esc(c.value)}</code><span>${esc(c.why)}</span></div>`).join('')+`<div class="section-title"><h3>静态变更热点</h3><span>${esc(A.heuristic.change_risk_score)}</span></div><div class="table"><div class="row header"><span>score</span><span>function</span><span>source</span><span>fan in</span><span>fan out</span></div>${A.hotspots.slice(0,12).map(h=>`<div class="row" data-node="${esc(h.node)}"><span class="score">${h.change_risk_score}</span><b>${esc(h.name)}</b><small>${esc(h.path)}:${h.line}</small><small>${h.fan_in}</small><small>${h.fan_out}</small></div>`).join('')}</div>`;wireNodeClicks();setGuide('架构健康','事实与启发式必须分开','上半部分是可判定不变量；下半部分用 fan-in、fan-out、长度和跨层调用排序，帮助选择重构入口。',`高分意味着“改它时值得多做影响检查”，不意味着代码一定差。动态调用无法被 AST 完整解析。`,`把确认有效的不变量放入 CI；对热点先用影响模拟和测试证据验证，再决定是否拆分。`)}
function candidates(q){q=q.trim().toLowerCase();if(!q)return[];return D.nodes.filter(n=>(n.name+' '+(n.qualified_name||'')+' '+(n.path||'')+' '+n.type).toLowerCase().includes(q)).slice(0,30)}
function impact(seed,depth){const up=new Map(),down=new Map();function walk(start,map,adj,d){let frontier=[start];map.set(start,0);for(let level=1;level<=d;level++){const next=[];for(const id of frontier)for(const e of adj.get(id)||[]){const other=adj===incoming?e.source:e.target;if(!map.has(other)){map.set(other,level);next.push(other)}}frontier=next}}walk(seed,up,incoming,depth);walk(seed,down,outgoing,depth);up.delete(seed);down.delete(seed);return{up:[...up],down:[...down]}}
function impactItems(ids){return ids.sort((a,b)=>a[1]-b[1]||nodeName(a[0]).localeCompare(nodeName(b[0]))).slice(0,80).map(([id,d])=>`<div class="impact-item" data-node="${esc(id)}"><b>${esc(nodeName(id))}</b><small>${esc(byId.get(id)?.type)} · distance ${d}</small></div>`).join('')||'<div class="empty">No linked nodes at this radius.</div>'}
function renderImpact(){const seed=byId.has(state.impactSeed)?state.impactSeed:'system:dispatcher',I=impact(seed,state.depth);main.innerHTML=head('change impact simulator','如果改这里，哪里可能一起动？','这是静态依赖半径，不是假装精确的预测。上游显示谁依赖它，下游显示它可能影响谁；选择 1–3 层来控制审查范围。')+`<div class="toolbox"><input id="impact-search" class="input" value="${esc(state.query)}" placeholder="搜索函数、命令、表、模块…"><select id="impact-depth" class="select"><option value="1">1 hop</option><option value="2">2 hops</option><option value="3">3 hops</option></select></div><div id="impact-results" class="search-results"></div><section class="impact"><div class="impact-col"><h4>Upstream · 谁依赖它 (${I.up.length})</h4>${impactItems(I.up)}</div><div class="impact-col impact-seed"><div><div class="eyebrow">change seed</div><b>${esc(nodeName(seed))}</b><small>${esc(byId.get(seed)?.type)}<br>${esc(byId.get(seed)?.path||'architectural node')}</small></div></div><div class="impact-col"><h4>Downstream · 它影响谁 (${I.down.length})</h4>${impactItems(I.down)}</div></section>`;document.getElementById('impact-depth').value=String(state.depth);document.getElementById('impact-depth').onchange=e=>{state.depth=Number(e.target.value);renderImpact()};document.getElementById('impact-search').oninput=e=>{state.query=e.target.value;const found=candidates(state.query);document.getElementById('impact-results').innerHTML=found.map(n=>`<button class="result" data-seed="${esc(n.id)}"><b>${esc(n.qualified_name||n.name)}</b><small>${esc(n.type)} · ${esc(n.path||n.layer)}</small></button>`).join('');document.querySelectorAll('[data-seed]').forEach(x=>x.onclick=()=>{state.impactSeed=x.dataset.seed;state.query='';renderImpact()})};wireNodeClicks();setGuide('影响模拟','半径不是结论，是审查清单','静态图最适合做“我可能漏掉谁”的提醒。它不应宣称一次修改必然导致某结果。',`先看上游契约和调用者，再看下游存储、方法、命令与 View。距离越远，误报也越多。`,`用结果决定需要运行哪些契约测试、parity gate、迁移检查或 UI 回归，而不是盲目跑全套。`)}
function renderExplorer(){const types=['all',...new Set(D.nodes.map(n=>n.type))];let rows=D.nodes;if(state.type!=='all')rows=rows.filter(n=>n.type===state.type);if(state.query)rows=rows.filter(n=>(JSON.stringify(n)).toLowerCase().includes(state.query.toLowerCase()));rows=rows.slice(0,120);main.innerHTML=head('function & object index','完整性留在索引里，不放在入口上','所有 in-scope 函数、方法、契约、数据库对象与架构节点仍然可搜索并追到源码行。入口只展示系统主干。')+`<div class="toolbox"><input id="explore-search" class="input" value="${esc(state.query)}" placeholder="例如 CommandDispatcher.execute / field_server.py / app.job"><select id="explore-type" class="select">${types.map(t=>`<option ${state.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="section-title"><h3>${rows.length} shown</h3><span>最多显示 120 条；继续输入以缩小范围</span></div><section class="search-results">${rows.map(n=>`<button class="result" data-node="${esc(n.id)}"><b>${esc(n.qualified_name||n.name)}</b><small>${esc(n.type)} · ${esc(n.path||n.layer)}${n.line?':'+n.line:''}</small></button>`).join('')}</section>`;document.getElementById('explore-search').oninput=e=>{state.query=e.target.value;renderExplorer()};document.getElementById('explore-type').onchange=e=>{state.type=e.target.value;renderExplorer()};wireNodeClicks();setGuide('完整索引','“每个函数”应该如何出现','函数级信息用于追责、影响分析和源码下钻，不适合成为默认架构地图。这里保留完整模型，搜索后再阅读局部关系。',`优先搜索业务意图、命令、方法或文件，再进入函数；不要从 2,000 个函数中肉眼找系统结构。`,`定位实现、检查 owner、理解局部调用关系，或把节点送入变更影响模拟。`)}
function inspectNode(id){const n=byId.get(id);if(!n)return;const ins=incoming.get(id)||[],outs=outgoing.get(id)||[];guide.innerHTML=`<div class="eyebrow">node inspection</div><h2>${esc(n.qualified_name||n.name)}</h2><span class="status pass">${esc(n.type)}</span>${n.path?`<div class="source">${esc(n.path)}${n.line?':'+n.line:''}${n.end_line&&n.end_line!==n.line?' → '+n.end_line:''}</div>`:''}<div class="guide-block"><h3>Attributes</h3>${Object.entries(n).filter(([k])=>!['id','name','qualified_name','type','path','line','end_line','runtime_evidence'].includes(k)).slice(0,14).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('')}</div><div class="guide-block"><h3>Relations · ${ins.length+outs.length}</h3>${[...ins.map(e=>['←',e,e.source]),...outs.map(e=>['→',e,e.target])].slice(0,60).map(([d,e,other])=>`<div class="relation" data-node="${esc(other)}">${d} ${esc(e.relation)} · ${esc(nodeName(other))}</div>`).join('')}</div><div class="guide-callout">要模拟修改此节点：打开“变更影响模拟”，搜索这个名称并选择 1–3 hop。</div>`;guide.querySelectorAll('[data-node]').forEach(x=>x.onclick=()=>inspectNode(x.dataset.node))}
render();
</script>
