<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Mol* Kernel Interface</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0a0d12;
            color: #edf1f7;
        }

        * { box-sizing: border-box; }

        html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }

        button, .file-button { font: inherit; }

        #app {
            display: grid;
            grid-template-columns: 286px minmax(0, 1fr);
            background: #0a0d12;
        }

        .sidebar {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 24px;
            border-right: 1px solid #222936;
            background: linear-gradient(180deg, #121720 0%, #0c1016 100%);
            box-shadow: 18px 0 46px rgb(0 0 0 / 24%);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #78d8c7;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }

        .intro {
            margin: 12px 0 26px;
            color: #929cac;
            font-size: 13px;
            line-height: 1.55;
        }

        .section-label {
            margin: 0 0 9px;
            color: #697488;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .controls { display: grid; gap: 8px; }

        button, .file-button {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #2b3442;
            border-radius: 10px;
            background: #181f2a;
            color: #e7ecf4;
            cursor: pointer;
            text-align: left;
            transition: border-color .15s ease, background .15s ease, transform .15s ease;
        }

        button:hover, .file-button:hover {
            border-color: #47756f;
            background: #1d2933;
            transform: translateY(-1px);
        }

        button:focus-visible, .file-button:focus-within {
            outline: 2px solid #78d8c7;
            outline-offset: 2px;
        }

        .primary {
            border-color: #5dc9b6;
            background: #5dc9b6;
            color: #07100e;
            font-weight: 750;
        }

        .primary:hover { background: #76decb; border-color: #76decb; }

        .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }

        .structure-card {
            margin-top: auto;
            padding: 15px;
            border: 1px solid #222b37;
            border-radius: 12px;
            background: rgb(255 255 255 / 3%);
        }

        #structure-name { margin: 0 0 5px; font-size: 14px; font-weight: 750; }
        #structure-stats { margin: 0; color: #7f8a9a; font-size: 12px; }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            color: #8f99a8;
            font-size: 11px;
        }

        .status-row::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f3b862;
            content: "";
            box-shadow: 0 0 0 3px rgb(243 184 98 / 12%);
        }

        .status-row:has(#status[data-state="ready"])::before { background: #6fd7a8; }
        .status-row:has(#status[data-state="error"])::before { background: #f27676; }

        .stage {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #f4f1ea;
        }

        #viewport { position: absolute; inset: 0; }

        .engine-badge {
            position: absolute;
            z-index: 1;
            top: 18px;
            right: 18px;
            padding: 7px 10px;
            border: 1px solid rgb(17 22 29 / 12%);
            border-radius: 999px;
            background: rgb(255 255 255 / 72%);
            color: #29313b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .03em;
            backdrop-filter: blur(12px);
            pointer-events: none;
        }

        #app[data-dark-viewport="true"] .engine-badge {
            border-color: rgb(255 255 255 / 10%);
            background: rgb(10 13 18 / 62%);
            color: #d9e0e9;
        }

        @media (max-width: 720px) {
            #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
            .sidebar { padding: 14px; border-right: 0; border-bottom: 1px solid #222936; }
            .intro, .structure-card { display: none; }
            .controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .controls button, .file-button { min-height: 38px; padding: 8px; font-size: 11px; text-align: center; }
            .section-label { margin-top: 12px; }
            .status-row { position: absolute; top: 16px; right: 14px; margin: 0; }
        }
    </style>
</head>
<body>
    <main id="app" data-ready="false" data-dark-viewport="false">
        <aside class="sidebar" aria-label="Molecular viewer controls">
            <p class="eyebrow">Custom interface</p>
            <h1>Molecular view</h1>
            <p class="intro">Our DOM and product language outside; Mol* state and rendering underneath.</p>

            <p class="section-label">Structure</p>
            <div class="controls">
                <button id="load-example" class="primary" type="button">Load bundled 1CRN</button>
                <label class="file-button">Open mmCIF file<input id="open-file" type="file" accept=".cif,.mmcif"></label>
                <button id="reset-camera" type="button">Reset camera</button>
                <button id="toggle-spin" type="button" data-active="false">Start spin</button>
                <button id="toggle-background" type="button">Dark background</button>
            </div>

            <div class="structure-card">
                <p class="section-label">Current model</p>
                <p id="structure-name">No structure</p>
                <p id="structure-stats">Waiting for data</p>
            </div>
            <div class="status-row" role="status" aria-live="polite"><span id="status" data-state="busy">Starting…</span></div>
        </aside>

        <section class="stage" aria-label="3D molecular viewport">
            <div id="viewport"></div>
            <div class="engine-badge">Mol* engine · custom UI</div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
