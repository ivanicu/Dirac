schema_version: '1.0'
title: Dirac Motif v2 implementation backlog
baseline_commit: 9d38ca434c9404843640ed5d7a4cb5d0a315d135
priority_order:
- P0
- P1
- P2
release_gates:
  A: durable local substrate
  B: credible local closed-loop Motif
  C: retrospective scientific advantage
  D: distributed durability and scale
  E: prospective scientific advantage
rules:
- A task is complete only when every acceptance item is automated or attached as an immutable evidence artifact.
- No scientific or public contract bypass is permitted for a faster demo.
- Scheduler and framework IDs remain private Allocation or Attempt metadata.
- P0 dependencies are blocking even if a downstream feature can be made to look functional without them.
